name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        shell: bash
        run: |
          set +e
          pytest -q --cov=agent_doctor --cov-report=term-missing --cov-fail-under=85 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## Pytest 失败（exit $status）"
              echo '```'
              tail -60 pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -40 pytest.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

  license:
    # 必须在 Windows 上跑：依赖集是平台相关的，typer 依赖
    # `colorama; platform_system == "Windows"`，Linux 上不装。
    # Windows 的依赖集是两个平台的超集，因此清单在 Windows 生成才完整。
    # 若在 Linux 上生成/校验，清单会少 colorama 一行而必然失败。
    name: license policy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: License policy and manifest freshness
        run: python scripts/gen_licenses.py --check

  package:
    # 构建只在一个平台跑：产物是 py3-none-any，与平台无关。
    # 目的是确认 sdist/wheel 能构建，且 wheel 里没有夹带测试、文档或缓存。
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify wheel contents
        run: python scripts/check_dist.py
