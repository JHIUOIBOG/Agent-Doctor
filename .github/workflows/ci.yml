name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest -q --cov=agent_doctor --cov-report=term-missing --cov-fail-under=85

  license:
    # 许可证检查只跑一次，不放进矩阵：结果与平台无关，
    # 独立 job 可以让失败原因一眼可见。
    name: license policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: License policy and manifest freshness
        run: python scripts/gen_licenses.py --check

  package:
    # 构建只在一个平台跑：产物是 py3-none-any，与平台无关。
    # 目的是确认 sdist/wheel 能构建，且 wheel 里没有夹带测试、文档或缓存。
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify wheel contents
        run: python scripts/check_dist.py
